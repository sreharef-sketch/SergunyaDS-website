[info]
title = About SergunyaDS
intro = SergunyaDS creates original ball-jointed dolls with a focus on character, articulation, and collectible sculptural detail.
printing_title = Self-printing notes
printing_text = STL releases include the parts and practical notes needed to print and assemble a doll frame. Check each product for its exact scale, included files, and recommended settings.
license_title = Personal-use licence
license_text = STL files are for personal use only. Do not redistribute, resell, or share the files or printed casts without the artist’s written permission.

